{% extends 'accounts/base.html' %}
{% block content %}
<div style="max-width: 850px; margin: 2rem auto; color:#f5f5f5;">
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
    <h2>7-Day Stress & Sleep Trends</h2>
    <a href="{% url 'wellness:log_list' %}" style="color:#ff4d4d;">← Back to Logs</a>
  </div>
  <div style="background:#1a1a1a; padding:1.5rem; border-radius:10px;">
    <canvas id="trendChart"></canvas>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
  new Chart(document.getElementById('trendChart'), {
    type: 'line',
    data: {
      labels: {{ labels_json|safe }},
      datasets: [
        { label: 'Stress Level (1-10)', data: {{ stress_json|safe }}, borderColor: '#ff4d4d', tension: 0.3 },
        { label: 'Sleep Hours', data: {{ sleep_json|safe }}, borderColor: '#4da6ff', tension: 0.3 },
        { label: 'Academic Workload (1-10)', data: {{ workload_json|safe }}, borderColor: '#f5a623', tension: 0.3 }
      ]
    },
    options: { scales: { y: { beginAtZero: true } } }
  });
</script>
{% endblock %}
