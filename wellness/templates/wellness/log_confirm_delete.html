{% extends 'accounts/base.html' %}
{% block content %}
<div style="max-width: 500px; margin: 2rem auto; background:#1a1a1a; padding:2rem; border-radius:10px; color:#f5f5f5;">
  <h2>Delete Wellness Log</h2>
  <p>Are you sure you want to delete your log for <strong>{{ log.log_date }}</strong>?</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit" style="background:#a60000; color:#fff; border:none; padding:10px 18px; border-radius:6px; cursor:pointer;">Confirm Delete</button>
    <a href="{% url 'wellness:log_list' %}" style="margin-left:12px; color:#ccc;">Cancel</a>
  </form>
</div>
{% endblock %}
