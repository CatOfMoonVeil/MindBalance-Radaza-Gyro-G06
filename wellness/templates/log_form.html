{% extends 'accounts/base.html' %}
{% block content %}
<div style="max-width: 600px; margin: 2rem auto; background:#1a1a1a; padding:2rem; border-radius:10px; color:#f5f5f5;">
  <h2>{{ action }} Wellness Log</h2>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" style="background:#a60000; color:#fff; border:none; padding:10px 18px; border-radius:6px; cursor:pointer;">Save Log</button>
    <a href="{% url 'wellness:log_list' %}" style="margin-left:12px; color:#ccc;">Cancel</a>
  </form>
</div>
{% endblock %}
