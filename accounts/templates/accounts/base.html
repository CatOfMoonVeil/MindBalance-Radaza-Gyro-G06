<!DOCTYPE html>
<html>
<head>
    <title>MindBalance Tracker</title>
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #1e1e1e;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(200, 0, 0, 0.15);
            text-align: center;
            width: 100%;
            max-width: 450px;
        }
        nav {
            margin-bottom: 20px;
        }
        nav a {
            color: #ff4d4d;
            text-decoration: none;
            font-weight: 600;
            margin: 0 10px;
            transition: color 0.2s;
        }
        nav a:hover {
            color: #ff1a1a;
        }
        hr {
            border: 0;
            height: 1px;
            background: #333;
            margin-bottom: 20px;
        }
        button {
            background-color: #a60000;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #cc0000;
        }
        input[type="text"], input[type="password"], input[type="email"] {
            width: 90%;
            padding: 10px;
            margin-top: 5px;
            margin-bottom: 15px;
            border: 1px solid #333;
            border-radius: 6px;
            background-color: #2c2c2c;
            color: white;
        }
        input:focus {
            outline: none;
            border-color: #ff4d4d;
        }
        ul {
            list-style-type: none;
            padding: 0;
        }
    </style>
</head>
<body>
<div class="container">
    <nav>
        {% if user.is_authenticated %}
        <a href="{% url 'dashboard_router' %}">Dashboard</a> |
        <a href="{% url 'profile' %}">Profile</a> |
        <form action="{% url 'logout' %}" method="post" style="display:inline;">
            {% csrf_token %}
            <button type="submit">Logout</button>
        </form>
        {% else %}
        <a href="{% url 'login' %}">Login</a> |
        <a href="{% url 'register' %}">Register</a>
        {% endif %}
    </nav>
    <hr>

    {% if messages %}
    <ul>
        {% for message in messages %}
        <li style="color: {% if message.tags == 'error' %}#ff4d4d{% else %}#4caf50{% endif %}; font-weight: bold;">
            {{ message }}
        </li>
        {% endfor %}
    </ul>
    {% endif %}

    {% block content %}{% endblock %}
</div>
</body>
</html>
